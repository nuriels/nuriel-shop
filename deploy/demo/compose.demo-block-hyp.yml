# ============================================================================================
# DEMO בלבד, שלב D6 (שרת ה-DEMO בלי Hyp): חוסם מתוך קונטיינר האפליקציה כל פנייה לשרתי Hyp.
# pay.hyp.co.il מופנה ל-127.0.0.1 בתוך הקונטיינר, שם אין שום שירות: כל ניסיון SIGN/VERIFY נכשל מיד
# ("Hyp לא זמינה"), ואין שום חיבור החוצה.
#
# בשימוש כל עוד אין אישור להרצה מול Hyp (D7/D8). ב-.env של האפליקציה בשרת ה-DEMO:
#   COMPOSE_FILE=docker-compose.yml:deploy/demo/compose.demo.yml:deploy/demo/compose.demo-block-hyp.yml
# רק באישור הרצה מול Hyp: מוחקים את החלק האחרון מ-COMPOSE_FILE, ומריצים docker compose up -d.
# deploy/demo/demo-check.sh מדווח אם החסימה פעילה.
# ============================================================================================
services:
  app:
    extra_hosts:
      - "pay.hyp.co.il:127.0.0.1"
