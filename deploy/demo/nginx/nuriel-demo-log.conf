# /etc/nginx/conf.d/nuriel-demo-log.conf — DEMO בלבד (נטען בתוך http {})
# יומן גישה בלי שורת השאילתה ובלי Referer:
#   • בנתיבי החזרה מ-Hyp השאילתה כוללת מזהה עסקה, חתימה ופרטי לקוח (ועם MoreData גם BIN ותוקף);
#   • ה-Referer של הבקשה הראשונה אחרי Hyp הוא כתובת דף התשלום, עם כל הפרמטרים שלה.
# $uri — הנתיב בלבד. $remote_user — שם המשתמש של הגנת הסיסמה (לא הסיסמה).
log_format nuriel_demo_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent $request_time "$http_user_agent"';
