# /etc/nginx/sites-available/kobi.nuri1.fit
# פורטל B2B להזמנת משקאות — פרוקסי לקונטיינר על 127.0.0.1:3500
# certbot --nginx -d kobi.nuri1.fit יוסיף את בלוק ה-443 אוטומטית.

server {
    listen 80;
    listen [::]:80;
    server_name kobi.nuri1.fit;

    # תמונות מוצר מועלות עד 10MB לקובץ, עם מרווח לאצוות
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
