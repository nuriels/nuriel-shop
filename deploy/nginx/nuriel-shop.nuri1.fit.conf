# /etc/nginx/sites-available/nuriel-shop.nuri1.fit
# האפליקציה (כל החנויות) — פרוקסי לקונטיינר nuriel-shop-app על 127.0.0.1:3700.
# החנות נקבעת לפי הדומיין, ולכן כל דומיין של חנות נוסף ל-server_name כאן.
# certbot --nginx -d <כל הדומיינים> יוסיף את בלוק ה-443.

server {
    listen 80;
    listen [::]:80;
    server_name nuriel-shop.nuri1.fit nuriel.nuri1.fit;

    # תמונות מוצר מועלות עד 20MB לקובץ, עם מרווח לאצוות
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # האפליקציה מזהה את החנות לפי הכותרת הזו — דורסים כל ערך שהגיע מהדפדפן
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
