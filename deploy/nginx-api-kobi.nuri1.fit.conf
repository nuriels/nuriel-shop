# /etc/nginx/sites-available/api-kobi.nuri1.fit
# ‏Supabase self-hosted של פורטל ה-B2B — פרוקסי ל-Kong על 127.0.0.1:8300
# (מקביל ל-api.nuri1.fit→8000 של nuri, Kong 8100 של Moments, ו-api-n→8200 של inv)
# certbot --nginx -d api-kobi.nuri1.fit יוסיף את בלוק ה-443.

server {
    listen 80;
    listen [::]:80;
    server_name api-kobi.nuri1.fit;

    # העלאת תמונות מוצר דרך ה-Storage API
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
