# ============================================================
# פורטל B2B להזמנת משקאות — SaaS מרובה חנויות
# מיועד ל-Coolify (Build Pack: Docker Compose). עובד גם מקומית:
#   cp .env.example .env && docker compose up -d --build
#
# ב-Coolify:
#   • אין ports / container_name / network — Coolify ו-Traefik מנהלים אותם.
#   • הדומיין מוגדר במסך השירות "app" כולל הפורט הפנימי, למשל:
#       https://shop.example.com:3000
#     (הפורט רק אומר ל-Traefik לאן לנתב בתוך הקונטיינר — הוא לא נחשף החוצה).
#   • ${VAR:?} = משתנה חובה: Coolify מציג אותו במסך Environment Variables
#     והפריסה נכשלת מראש אם הוא ריק.
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # נאפים לבאנדל הדפדפן בזמן הבנייה — אותם ערכים כמו בזמן ריצה,
        # כך שב-Coolify מגדירים כל משתנה פעם אחת בלבד.
        VITE_SUPABASE_URL: ${SUPABASE_URL:?}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?}
    restart: unless-stopped
    # tini כ-PID 1: עצירה/פריסה מחדש מהירה ונקייה (SIGTERM מגיע ל-Node)
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # --- Supabase (מנוהל או self-hosted ב-Coolify) ---
      SUPABASE_URL: ${SUPABASE_URL:?}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?}
      # סוד! עוקף RLS — רק בצד השרת, לעולם לא ב-VITE_*
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      # --- מיילים (Resend) — מפתח אחד לכל החנויות. ריק = ההזמנות נקלטות אבל מיילים לא נשלחים ---
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # כתובת השולח (דומיין מאומת ב-Resend). השם = שם החנות: "שם החנות <orders@nuri1.fit>".
      # ריק = orders@<TENANT_BASE_DOMAIN>
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      # סוד לחתימת קודי הכניסה למייל (HMAC). ריק = נגזר ממפתח ה-service role
      LOGIN_CODE_SECRET: ${LOGIN_CODE_SECRET:-}
      # שליחת רישיונות דיגיטליים: מפתח הצפנת מפתחות הרישיון במסד (AES-256-GCM, נגזר ב-HKDF).
      # סוד! נוצר פעם אחת ע"י setup-selfhost.sh. אם יאבד — אי אפשר לפענח מפתחות שכבר נשמרו.
      # ריק = המודול לא שומר ולא שולח רישיונות.
      LICENSE_KEYS_SECRET: ${LICENSE_KEYS_SECRET:-}
      # סליקה דרך Grow (חלק 43): מפתח הצפנת פרטי המסוף של החנויות (AES-256-GCM).
      # סוד! נוצר פעם אחת ע"י setup-selfhost.sh. אם יאבד — צריך להזין מחדש את פרטי המסופים.
      GROW_SECRETS_KEY: ${GROW_SECRETS_KEY:-}
      # כתובת ה-API של Grow בייצור (נמסרת ע"י Grow ביום המעבר; סנדבוקס מובנה בקוד)
      GROW_API_URL: ${GROW_API_URL:-}
      # --- תשלומים אונליין (MAX/Hyp) — docs/payment-gateways/DEMO-IMPLEMENTATION-CONTRACT.md §2 ---
      # הסביבה: demo בשרת ה-DEMO, production רק בשרת הייצור. ריק = התשלומים אונליין כבויים
      PAYMENTS_ENV: ${PAYMENTS_ENV:-}
      # סוד! מפתח השורש להצפנת פרטי המסופים של החנויות: 32 תווים אקראיים לפחות, שונה מכל סוד אחר
      # ולעולם לא אותו ערך בשתי סביבות. אם יאבד — צריך להזין מחדש את פרטי המסופים
      PAYMENTS_SECRETS_KEY: ${PAYMENTS_SECRETS_KEY:-}
      # סוד! מפתח השורש להצפנת פרטי מסוף הפלטפורמה (NURIEL) — אותם כללים, ושונה מ-PAYMENTS_SECRETS_KEY
      PLATFORM_TERMINAL_SECRETS_KEY: ${PLATFORM_TERMINAL_SECRETS_KEY:-}
      # "off" עוצר את עבודות התשלום ברקע (פקיעה, VERIFY חוזר) בתהליך הזה. ריק = פועל (on)
      PAYMENTS_JOBS: ${PAYMENTS_JOBS:-}
      # כתובת חנות ברירת המחדל — לקישורים במיילים (איפוס סיסמה, הזמנות)
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      # דומיין בסיס לחנויות בתת-דומיין: shop2.<TENANT_BASE_DOMAIN>
      # (חנות עם דומיין משלה מוגדרת ב-tenants.domain ולא צריכה את זה)
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
      # דומיין פאנל ניהול הפלטפורמה (/platform) — לא משמש כחנות
      PLATFORM_ADMIN_HOST: ${PLATFORM_ADMIN_HOST:-}
      # דומיינים מותאמים של חנויות: כתובות ה-IP של השרת לבדיקת רשומת A (אופציונלי —
      # ברירת מחדל: הכתובת ש-<slug>.<TENANT_BASE_DOMAIN> מפנה אליה)
      SERVER_PUBLIC_IPS: ${SERVER_PUBLIC_IPS:-}
      # --- Hospitality (מנוע האירוח) — docs/hospitality/install-guide.md §5 ---
      # המתג הכללי: רק "on" מפעיל. ריק = כבוי (ברירת המחדל)
      HOSPITALITY_ENGINE: ${HOSPITALITY_ENGINE:-}
      # Nuriel Websites (אתרי עסקים): המנוע וממשק הניהול רצים רק כשזה on (deploy/release-websites.sh מגדיר).
      # בנוסף נדרש דגל הפלטפורמה business_profile_enabled; אתר ציבורי — רק אחרי אישור פרסום.
      BUSINESS_PROFILE_ENGINE: ${BUSINESS_PROFILE_ENGINE:-}
      # סוד! HMAC להגבלת הקצב ולאתגרי ה-CAPTCHA (openssl rand -hex 32). זהה בכל השרתים
      HOSPITALITY_SECRET: ${HOSPITALITY_SECRET:-}
      # קושי אתגר ה-CAPTCHA (לא חובה; 1000–2000000, ברירת מחדל 50000)
      HOSPITALITY_POW_MAX: ${HOSPITALITY_POW_MAX:-}
      # --- הגדרות מפעיל שהקוד קורא (ריק = ברירת המחדל שבקוד; בלי הרשימה הזו הן לא מגיעות לקונטיינר) ---
      # כתובת/ות (מופרדות בפסיק) שמקבלות התראות תמיכה במקום כתובת מנהל הפלטפורמה
      SUPPORT_NOTIFY_EMAIL: ${SUPPORT_NOTIFY_EMAIL:-}
      # סוד HMAC לקודי האימות והפניות של אתרי העסקים. ריק = נגזר מ-LOGIN_CODE_SECRET
      BUSINESS_PROFILE_SECRET: ${BUSINESS_PROFILE_SECRET:-}
      # יעד ה-CNAME שמוצג ללקוח בחיבור דומיין משלו. ריק = <slug>.<TENANT_BASE_DOMAIN> של השער
      CUSTOM_DOMAIN_CNAME_TARGET: ${CUSTOM_DOMAIN_CNAME_TARGET:-}
      # מארחי תמונות נוספים (מופרדים בפסיק) שמותר לייבא מהם תמונות מוצרים. ריק = רק הרשימה המובנית
      IMPORT_IMAGE_ALLOW_HOSTS: ${IMPORT_IMAGE_ALLOW_HOSTS:-}
      # "off" מכבה את מתזמן התראות החידוש של תוסף ה-AI בתהליך הזה (למשל בשרת שני). ריק = פועל
      AI_RENEWAL_JOB: ${AI_RENEWAL_JOB:-}
      # NURIEL AI SEO ENGINE: "off" מכבה את עובד ה-SEO בתהליך הזה (בדיקות, הצעות, Search Console). ריק = פועל
      SEO_WORKER: ${SEO_WORKER:-}
      # "on" — ההפקה ברקע (עסק / יחידה / מוצר חדשים) רשאית להשתמש ב-NURIEL AI, רק לעסק עם חבילה בתוקף ובמכסות
      # שלו. ריק = ברקע רק הצעות בסיסיות (בלי AI); בעל העסק עדיין יכול לבקש הצעות AI מהמסך
      SEO_BACKGROUND_AI: ${SEO_BACKGROUND_AI:-}
      # Google Search Console (קריאה בלבד): לקוח OAuth של הפלטפורמה. ריק = החיבור הישיר לא מוצע (ייבוא CSV עובד)
      GSC_OAUTH_CLIENT_ID: ${GSC_OAUTH_CLIENT_ID:-}
      GSC_OAUTH_CLIENT_SECRET: ${GSC_OAUTH_CLIENT_SECRET:-}
      # הכתובת שאליה Google מחזיר אחרי האישור (/api/seo/gsc/callback). ריק = PLATFORM_ADMIN_HOST
      GSC_OAUTH_REDIRECT_HOST: ${GSC_OAUTH_REDIRECT_HOST:-}
    healthcheck:
      # R-4: /healthz (חיות, בלי מסד). הגיבוי ל-/robots.txt — רק לתמונה ישנה בחזרה לאחור (ראו Dockerfile)
      test: ["CMD", "node", "-e", "const u='http://127.0.0.1:3000',ok=p=>fetch(u+p).then(r=>r.ok).catch(()=>false);ok('/healthz').then(a=>a||ok('/robots.txt')).then(a=>process.exit(a?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
