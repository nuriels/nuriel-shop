# ============================================================
# בדיקות (שלב 0) — רץ על ענפי הפיתוח ועל Pull Requests.
# • אין כאן שום סוד ושום חיבור ל-Production: המסד הוא Postgres / Supabase
#   מקומי וחד-פעמי בתוך ה-runner, והמיילים / התשלומים מדומים.
# • לא בונה ולא דוחף Docker, ולא נוגע בפריסה (Coolify).
# ============================================================
name: tests

on:
  push:
    branches: ["hospitality/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: typecheck (app + tests)
        run: bun run typecheck
      - name: lint new code (strict) — tests and the engine layers (incl. import boundaries)
        run: npx eslint tests e2e scripts/preview vitest.config.ts eslint.config.js src/platform src/engines src/app src/start.ts src/server.ts src/routes/__root.tsx src/routes/manage.tsx src/routes/manage.index.tsx src/routes/manage_.login.tsx src/routes/manage.settings.tsx src/routes/manage.team.tsx src/routes/manage.units.tsx src/routes/manage.photos.tsx src/routes/manage.pricing.tsx src/routes/manage.policies.tsx src/routes/manage.calendar.tsx src/routes/manage.bookings.tsx 'src/routes/manage.bookings_.$bookingId.tsx' src/routes/manage.bookings_.new.tsx src/routes/platform_.hospitality.tsx 'src/routes/manage.units_.$unitId.tsx' 'src/routes/manage.properties.$propertyId.tsx' vite.config.ts
      - name: lint whole repo (report only — 28 known formatting errors, see docs/testing.md)
        continue-on-error: true
        run: bun run lint
      - name: unit tests (Vitest)
        run: bun run test:unit
      - name: legacy check scripts
        run: bun run test:scripts
      - name: build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-only-placeholder
        run: bun run build

  db:
    name: SQL tests (local Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: install PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update && sudo apt-get install -y postgresql-16
          fi
      - name: SQL tests
        run: bash scripts/db-tests/run.sh
      - name: migration rollback check
        run: bash scripts/db-tests/rollback-check.sh
      - name: booking concurrency (parallel sessions)
        run: bash scripts/db-tests/hospitality/concurrency/run.sh

  e2e:
    name: E2E regression (Playwright + local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: start local Supabase (all migrations + test seed)
        run: bun run e2e:up
      - name: build the app against the local Supabase
        run: |
          set -a; . e2e/.env.e2e; set +a
          bun run build
      - name: E2E tests
        env:
          E2E_SKIP_BUILD: "1"
        run: bun run test:e2e
      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: stop local Supabase
        if: always()
        run: bun run e2e:down || true

  preview:
    name: Hospitality preview (demo data · screenshots + videos)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: install ffmpeg (MP4 videos that play on every phone)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: start local Supabase (all migrations + test seed)
        run: bun run e2e:up
      - name: build the app against the local Supabase
        run: |
          set -a; . e2e/.env.e2e; set +a
          bun run build
      - name: demo data + recorded walkthrough (desktop + phone; every step checked)
        env:
          E2E_SKIP_BUILD: "1"
        run: bun run hosp:preview:record
      - name: upload screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-preview
          path: |
            e2e/preview/out/index.html
            e2e/preview/out/screens
            e2e/preview/out/videos
          retention-days: 14
      - name: stop local Supabase
        if: always()
        run: bun run e2e:down || true
